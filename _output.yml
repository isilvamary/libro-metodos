bookdown::gitbook:
  css: style.css
  config:
    sharing:
      facebook: yes
      twitter: yes
      github: yes
      all: ['facebook', 'twitter', 'linkedin', 'weibo', 'instapaper']
    toolbar:
      position: fixed
    edit: null
    download: ["pdf", "epub"]
    search: yes
bookdown::pdf_book:
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
  keep_tex: yes
